
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dadonate - inclusive creator support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              dyslexic: ['Lexend', 'Comic Sans MS', 'sans-serif'],
            },
            colors: {
              maroon: {
                DEFAULT: '#800000',
                light: '#A00000',
                dark: '#600000',
              },
              gold: {
                DEFAULT: '#D4AF37',
                light: '#F3E5AB',
                dark: '#B8860B',
              }
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Lexend:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            letter-spacing: -0.02em;
        }
        
        /* Accessibility: Dyslexic Font */
        .dyslexic-mode {
            font-family: 'Lexend', sans-serif !important;
            letter-spacing: 0.05em !important;
            word-spacing: 0.1em !important;
        }
        
        /* Accessibility: Text Scaling */
        .text-scale-large { font-size: 1.15rem; }
        .text-scale-xl { font-size: 1.3rem; }
        
        .text-scale-large h1 { font-size: 1.25em; }
        .text-scale-xl h1 { font-size: 1.5em; }

        /* Accessibility: High Contrast */
        .high-contrast-mode {
            --tw-bg-opacity: 1 !important;
            filter: contrast(1.5) saturate(1.2);
        }
        .high-contrast-mode .bg-white { background-color: #ffffff !important; color: #000000 !important; }
        .high-contrast-mode .bg-black { background-color: #000000 !important; color: #ffffff !important; }
        .high-contrast-mode .text-gray-500, 
        .high-contrast-mode .text-gray-400 { color: #000000 !important; font-weight: 900 !important; }
        .dark .high-contrast-mode .text-gray-400 { color: #ffffff !important; }

        /* Focus States */
        *:focus-visible {
            outline: 4px solid #D4AF37 !important;
            outline-offset: 2px;
            z-index: 50;
        }

        /* Premium Minimalist Utilities */
        .border-premium { border: 2px solid #000; }
        .dark .border-premium { border: 2px solid #D4AF37; }
        
        .shadow-flat { box-shadow: 4px 4px 0px 0px #000; }
        .dark .shadow-flat { box-shadow: 4px 4px 0px 0px #D4AF37; }
        
        .shadow-flat-lg { box-shadow: 8px 8px 0px 0px #000; }
        .dark .shadow-flat-lg { box-shadow: 8px 8px 0px 0px #D4AF37; }

        .btn-press {
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn-press:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px 0px #000;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            background: #000;
            color: #fff;
            border: 1px solid #000;
        }
        .dark .badge {
            background: #D4AF37;
            color: #000;
            border-color: #D4AF37;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 12px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .dark ::-webkit-scrollbar-track {
            background: #111;
        }
        ::-webkit-scrollbar-thumb {
            background: #800000;
            border: 3px solid #f1f1f1;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #D4AF37;
            border: 3px solid #111;
        }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "qrcode.react": "https://esm.sh/qrcode.react@^3.1.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
<body class="bg-[#FDFDFD] dark:bg-[#050505] text-black dark:text-white transition-colors duration-300">
    <div id="root"></div>
</body>
</html>
