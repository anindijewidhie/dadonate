
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dadonate - inclusive creator support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              dyslexic: ['Lexend', 'Comic Sans MS', 'sans-serif'],
            },
            colors: {
              maroon: {
                DEFAULT: '#800000',
                light: '#A00000',
                dark: '#600000',
              },
              gold: {
                DEFAULT: '#D4AF37',
                light: '#F3E5AB',
                dark: '#B8860B',
              }
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Lexend:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            letter-spacing: -0.01em;
            font-style: normal !important;
        }
        
        /* Accessibility: Dyslexic Font */
        .dyslexic-mode {
            font-family: 'Lexend', sans-serif !important;
            letter-spacing: 0.05em !important;
            word-spacing: 0.1em !important;
        }
        
        /* Accessibility: Text Scaling */
        .text-scale-large { font-size: 1.15rem; }
        .text-scale-xl { font-size: 1.3rem; }
        
        .text-scale-large h1 { font-size: 1.25em; }
        .text-scale-xl h1 { font-size: 1.5em; }

        /* Accessibility: High Contrast */
        .high-contrast-mode {
            filter: contrast(1.2);
        }
        .high-contrast-mode .bg-white { background-color: #ffffff !important; color: #000000 !important; }
        .high-contrast-mode .bg-black { background-color: #000000 !important; color: #ffffff !important; }

        /* Focus States */
        *:focus-visible {
            outline: 2px solid #800000 !important;
            outline-offset: 2px;
            z-index: 50;
        }
        .dark *:focus-visible {
            outline-color: #D4AF37 !important;
        }

        /* Nordic Linework Utilities (No Shadows) */
        .border-premium { border: 1px solid #000; }
        .dark .border-premium { border: 1px solid #D4AF37; }
        
        .border-premium-thick { border: 2px solid #000; }
        .dark .border-premium-thick { border: 2px solid #D4AF37; }

        .btn-press {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-press:active {
            opacity: 0.8;
            transform: scale(0.98);
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.6rem;
            letter-spacing: 0.15em;
            background: #000;
            color: #fff;
            font-style: normal;
        }
        .dark .badge {
            background: #D4AF37;
            color: #000;
        }

        /* Custom minimal scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #E5E7EB;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #374151;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #D1D5DB;
        }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "qrcode.react": "https://esm.sh/qrcode.react@^3.1.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
<body class="bg-[#F9F9F9] dark:bg-[#0F0F0F] text-black dark:text-white transition-colors duration-300">
    <div id="root"></div>
</body>
</html>
